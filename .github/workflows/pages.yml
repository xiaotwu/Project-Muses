name: Publish legacy website redirects
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-muses-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage compatibility pages and existing static artwork
        run: |
          mkdir -p "$RUNNER_TEMP/muses-site/ios"
          cp docs/.nojekyll docs/*.html "$RUNNER_TEMP/muses-site/"
          cp docs/ios/*.html docs/ios/styles.css "$RUNNER_TEMP/muses-site/ios/"
          cp -R docs/assets "$RUNNER_TEMP/muses-site/assets"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/muses-site
      - uses: actions/deploy-pages@v4
        id: deploy
